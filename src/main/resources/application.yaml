spring:
  application:
    name: RMS-Backend

  datasource:
    url: jdbc:postgresql://localhost:5432/rms-dev
    username: postgres
    password: postgres

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # options: none, validate, update, create, create-drop

    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect