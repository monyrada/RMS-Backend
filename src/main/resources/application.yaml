server:
  port: ${PORT:8080}

spring:
  application:
    name: RMS-Backend

  datasource:
    url: jdbc:postgresql://localhost:5432/rms-dev
    username: postgres
    password: postgres

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # options: none, validate, update, create, create-drop

    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    rmsbackend.common.logging.RequestBodyLoggingFilter: INFO

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-before-production}
    access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:15}
  refresh-token:
    expiry-minutes: ${REFRESH_TOKEN_EXPIRY_MINUTES:10080}
  seed:
    system-user:
      enabled: ${SYSTEM_USER_SEED_ENABLED:true}
      email: ${SYSTEM_USER_EMAIL:admin@rms.local}
      password: ${SYSTEM_USER_PASSWORD:Admin@12345}
  qr:
    base-url: ${QR_BASE_URL:http://localhost:5173}
    image-size: ${QR_IMAGE_SIZE:320}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://rms-test-tau.vercel.app,http://localhost:5173}
