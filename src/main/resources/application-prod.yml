spring:
  application:
    name: RMS-Backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}  # options: none, validate, update, create, create-drop

    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://rms-test-tau.vercel.app}
  qr:
    base-url: ${QR_BASE_URL:https://rms-test-tau.vercel.app}